[project]
name = "dashboard-factory"
version = "0.1.0"
description = "Verified metric and dashboard generation for AI Wholesale Platform"
requires-python = ">=3.14"
dependencies = [
  "duckdb",
  "polars",
  "pydantic>=2",
  "pyyaml",
  "typer",
  "xlsxwriter",
]

[project.scripts]
dashboard-factory = "dashboard_factory.cli:app"

[dependency-groups]
dev = [
  "pytest",
  "ruff",
  "pyrefly",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard_factory"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
