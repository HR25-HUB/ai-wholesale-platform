name: Dashboard Factory CI

on:
  pull_request:
    paths:
      - "services/dashboard_factory/**"
      - "docs/dashboard_factory/**"
      - ".github/instructions/dashboard-factory.instructions.md"
      - ".github/prompts/implement-dashboard-change.prompt.md"
      - ".github/workflows/dashboard-factory-ci.yml"
      - "AGENTS.md"
  push:
    branches: [main]
    paths:
      - "services/dashboard_factory/**"
      - "docs/dashboard_factory/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard_factory

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyrefly
        run: uv run pyrefly check

      - name: Pytest
        run: uv run pytest -q
