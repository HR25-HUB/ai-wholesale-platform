name: NUIF Prefect RFQ CI

on:
  pull_request:
    paths:
      - "app/application/**"
      - "app/infrastructure/**"
      - "contracts/product_matching.py"
      - "flows/rfq_pipeline.py"
      - "tests/test_prefect_rfq.py"
      - "tests/test_real_case_gate.py"
      - "scripts/verify_real_rfq.py"
      - ".github/workflows/prefect-rfq-ci.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contract-and-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install isolated test tools
        run: uv pip install --system "prefect>=3,<4" "pydantic>=2,<3" pytest ruff pyrefly
      - name: Ruff
        run: ruff check --select E4,E7,E9,F app/application app/infrastructure contracts/product_matching.py flows/rfq_pipeline.py tests/test_prefect_rfq.py tests/test_real_case_gate.py scripts/verify_real_rfq.py
      - name: Pyrefly
        run: pyrefly check app/application/evidence_verification.py app/application/product_matching.py contracts/product_matching.py
      - name: Pytest
        run: python -m pytest -q tests/test_prefect_rfq.py tests/test_real_case_gate.py
      - name: Domain independence
        run: |
          python - <<'PY'
          from pathlib import Path
          for f in Path("app/domain").rglob("*.py"):
              content = f.read_text(encoding="utf-8")
              assert "from prefect" not in content and "import prefect" not in content, f
          PY

# Real-case validation requires authorized source records in a secured environment.
# No real RFQ/PIM data is uploaded into GitHub Actions. This job validates code only.
