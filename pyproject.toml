[project]
name = "ai_wholesale_platform"
version = "0.2.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic",
    "prefect",
    "fastapi",
    "uvicorn",
    "opensearch-py",
    "streamlit"
]

[tool.setuptools.packages.find]
include = ["app*", "agents*", "flows*", "ai_platform*", "contracts*", "dashboards*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
